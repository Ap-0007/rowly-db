name: Recursos

# Ciclos de recursos en la app real (app/tests/e2e/resources.mjs): un job por
# escenario, en paralelo, con el binario de app-build.yml y sus propios
# servidores y perfil. Cada escenario ya arranca su app; corridos uno detras
# de otro tardaban unos 25 min. Los conteos, reposos y umbrales son los
# mismos: lo unico que cambia es que corren a la vez.
#
# El ultimo job comprueba que cada escenario pedido corrio y paso
# (tools/ci/scenarios.mjs): un job que no subio su reporte no cuenta como
# exito.

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      scenarios:
        description: 'Escenarios (JSON, p. ej. ["consoles"]) o * para todos (tools/ci/areas.json)'
        type: string
        default: "*"

env:
  APT: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential curl wget file libssl-dev libgtk-3-dev webkit2gtk-driver xvfb xdotool mysql-client dbus-bin

jobs:
  list:
    name: Escenarios pedidos
    runs-on: ubuntu-latest
    outputs:
      scenarios: ${{ steps.list.outputs.scenarios }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          sparse-checkout: tools/ci
      - id: list
        env:
          SCENARIOS: ${{ inputs.scenarios }}
        run: |
          if [ "$SCENARIOS" = "*" ]; then SCENARIOS=$(jq -c '.resources' tools/ci/areas.json); fi
          jq -e 'type == "array" and length > 0' <<< "$SCENARIOS" > /dev/null
          echo "scenarios=$(jq -c . <<< "$SCENARIOS")" >> "$GITHUB_OUTPUT"

  scenario:
    name: Recursos ${{ matrix.scenario }}
    needs: list
    runs-on: ubuntu-latest
    # El escenario mas largo (1, 5 y 10 sesiones en reposo) tarda unos 9 min;
    # un runner con apt lento necesita margen.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.list.outputs.scenarios) }}
    services:
      mysql:
        image: public.ecr.aws/docker/library/mysql:8.4.11@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
        env:
          MYSQL_ROOT_PASSWORD: rowly
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -uroot -prowly"
          --health-interval=5s --health-timeout=5s --health-retries=30
      # Solo para los ciclos de reconexion: otro motor y otra linea.
      postgres:
        image: public.ecr.aws/docker/library/postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_PASSWORD: rowly
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Xvfb y dbus-run-session
        run: sudo apt-get update && sudo apt-get install -y $APT

      - uses: actions/setup-node@v4
        with:
          # 22: WebSocket nativo para el inspector de resources.mjs.
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: e2e-app
          path: bin

      - name: Ciclos de recursos
        working-directory: app
        env:
          E2E_MYSQL_PORT: "3306"
          E2E_PG_PORT: "5432"
          E2E_SCENARIOS: ${{ matrix.scenario }}
        # Sin WebDriver: la app se abre con el inspector de WebKit, que mide el
        # heap de JavaScript vivo (tests/e2e/inspector.mjs).
        run: chmod +x ../bin/rowly-db && xvfb-run --auto-servernum dbus-run-session -- node tests/e2e/resources.mjs --app "$GITHUB_WORKSPACE/bin/rowly-db" --report "$RUNNER_TEMP/report.json"

      - name: Reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resources-${{ matrix.scenario }}
          path: ${{ runner.temp }}/report.json
          retention-days: 7

  report:
    name: Cada escenario corrio y paso
    needs: [list, scenario]
    if: always() && needs.list.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          sparse-checkout: tools/ci
      - uses: actions/download-artifact@v4
        with:
          pattern: resources-*
          path: reports
      - name: Escenarios
        env:
          SCENARIOS: ${{ needs.list.outputs.scenarios }}
        run: node tools/ci/scenarios.mjs reports --expect "$(jq -r 'join(",")' <<< "$SCENARIOS")"
