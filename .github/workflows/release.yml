name: Release

# Un tag vX.Y.Z (o vX.Y.Z-rc.N para una versión preliminar) publica una
# release con los instaladores de cada sistema y el latest.json firmado que
# usa Ajustes > Actualizaciones. Las releases no se borran: son el historial
# al que la app deja volver.
#
# Nada se publica sin las compuertas del mismo commit, todas completas (sin
# el planner de ci.yml): Rust, Node, E2E, recursos y la compuerta de motor
# (matriz de cada versión verificada con las semillas de la release y D7/D8)
# corren en esta misma corrida sobre el commit del tag, y `verify` comprueba
# que toda la evidencia sea de ese commit y completa
# (tools/test-dbs/evidence.mjs --release). Los instaladores se compilan en
# paralelo con las compuertas (release-build.yml) y un solo job publica todo
# cuando las dos cosas terminaron bien.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: El tag coincide con la versión de la app
        run: |
          app_version=$(python3 -c "import json; print(json.load(open('app/src-tauri/tauri.conf.json'))['version'])")
          if [ "v${app_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "El tag ${GITHUB_REF_NAME} no coincide con la versión ${app_version} de tauri.conf.json" >&2
            exit 1
          fi

  rust:
    needs: version
    uses: ./.github/workflows/rust.yml

  node:
    needs: version
    uses: ./.github/workflows/node.yml

  app:
    needs: version
    uses: ./.github/workflows/app-build.yml

  e2e:
    needs: app
    uses: ./.github/workflows/e2e.yml

  resources:
    needs: app
    uses: ./.github/workflows/resources.yml

  sql:
    needs: version
    uses: ./.github/workflows/sql-engine.yml
    with:
      fuzz_cases: "4000"
      # Las semillas que exige la release (SQL_ENGINE §7, evidence.mjs RELEASE_SEEDS).
      fuzz_seeds: "0,1,2"

  build:
    needs: version
    uses: ./.github/workflows/release-build.yml
    with:
      tag: ${{ github.ref_name }}
      dry-run: false
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  verify:
    name: Evidencia del commit ${{ github.sha }}
    needs: [rust, node, e2e, resources, sql]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: El checkout es el commit del tag
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Nada fuera de la ventana de soporte anunciado como verificado (SQL_ENGINE §5.2)
        run: node tools/test-dbs/window.mjs --release
      - uses: actions/download-artifact@v4
        with:
          pattern: real-*
          path: evidence
      - uses: actions/download-artifact@v4
        with:
          pattern: lines-*
          path: evidence
      - name: Toda la evidencia es de este commit, completa, y las compuertas pasaron
        run: >-
          node tools/test-dbs/evidence.mjs evidence --release --commit "$GITHUB_SHA"
          --gate rust=${{ needs.rust.result }}
          --gate node=${{ needs.node.result }}
          --gate e2e=${{ needs.e2e.result }}
          --gate resources=${{ needs.resources.result }}
          --gate sql=${{ needs.sql.result }}
          --out verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-verification
          path: verification.json

  # El unico job que escribe en la release: borrador con todo, y se publica
  # al final. Un build o una compuerta que fallo no llega aqui.
  publish:
    name: Publicar ${{ github.ref_name }}
    needs: [verify, build]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: release-verification
          path: dist
      - name: Novedades de esta version para el aviso de actualizacion
        run: |
          highlight="docs/release/${TAG}.json"
          if [ -f "$highlight" ]; then cp "$highlight" dist/highlight.json; fi
      - name: Todas las plataformas, firmadas, en latest.json
        run: |
          jq -e --arg version "${TAG#v}" '.version == $version and (.platforms | length) == 12' dist/latest.json
          ls -l dist
      - name: Publicar
        run: |
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft "${prerelease[@]}" \
            --title "Rowly DB $TAG" \
            --notes "Commit $GITHUB_SHA. Verificación de este commit (Quality, E2E, matriz SQL y D7/D8): verification.json." \
            dist/*
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
