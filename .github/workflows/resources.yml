name: Recursos

# Ciclos de recursos en la app real (app/tests/e2e/resources.mjs): un job por
# escenario, en paralelo, con el binario de app-build.yml y sus propios
# servidores y perfil. Cada escenario ya arranca su app; corridos uno detras
# de otro tardaban unos 25 min. Los conteos, reposos y umbrales son los
# mismos: lo unico que cambia es que corren a la vez.
#
# El ultimo job comprueba que cada escenario pedido corrio y paso
# (tools/ci/scenarios.mjs): un job que no subio su reporte no cuenta como
# exito.
#
# Las imagenes de MySQL y PostgreSQL se bajan una sola vez (job `list`) y
# viajan como artefacto: siete jobs bajandolas del registro publico a la vez
# chocaban con su limite de datos anonimos. Cada job comprueba que cargo la
# misma imagen (su ID) que se bajo por digest.

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      scenarios:
        description: 'Escenarios (JSON, p. ej. ["consoles"]) o * para todos (tools/ci/areas.json)'
        type: string
        default: "*"

env:
  # Versiones de `verified` en tools/test-dbs/lines.json, con su digest: la
  # fuente unica de servidores de prueba (crates/server-tests lo comprueba).
  MYSQL_IMAGE: public.ecr.aws/docker/library/mysql:8.4.11@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
  # Solo para los ciclos de reconexion: otro motor y otra linea.
  POSTGRES_IMAGE: public.ecr.aws/docker/library/postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
  APT: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential curl wget file libssl-dev libgtk-3-dev webkit2gtk-driver xvfb xdotool mysql-client dbus-bin

jobs:
  list:
    name: Escenarios pedidos
    runs-on: ubuntu-latest
    outputs:
      scenarios: ${{ steps.list.outputs.scenarios }}
      mysql: ${{ steps.images.outputs.mysql }}
      postgres: ${{ steps.images.outputs.postgres }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          sparse-checkout: tools/ci
      - id: list
        env:
          SCENARIOS: ${{ inputs.scenarios }}
        run: |
          if [ "$SCENARIOS" = "*" ]; then SCENARIOS=$(jq -c '.resources' tools/ci/areas.json); fi
          jq -e 'type == "array" and length > 0' <<< "$SCENARIOS" > /dev/null
          echo "scenarios=$(jq -c . <<< "$SCENARIOS")" >> "$GITHUB_OUTPUT"
      # Con reintentos, como tools/test-dbs/up.sh.
      - name: Imagenes de los servidores, una vez
        id: images
        run: |
          for image in "$MYSQL_IMAGE" "$POSTGRES_IMAGE"; do
            for attempt in 1 2 3 4 5 6; do
              docker pull -q "$image" && break
              [ "$attempt" = 6 ] && { echo "no se pudo descargar $image" >&2; exit 1; }
              sleep $((attempt * 20))
            done
          done
          docker tag "$MYSQL_IMAGE" rowly-ci/mysql
          docker tag "$POSTGRES_IMAGE" rowly-ci/postgres
          echo "mysql=$(docker image inspect -f '{{.Id}}' rowly-ci/mysql)" >> "$GITHUB_OUTPUT"
          echo "postgres=$(docker image inspect -f '{{.Id}}' rowly-ci/postgres)" >> "$GITHUB_OUTPUT"
          docker save rowly-ci/mysql rowly-ci/postgres | gzip -1 > images.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: resources-images
          path: images.tar.gz
          retention-days: 1
          compression-level: 0

  scenario:
    name: Recursos ${{ matrix.scenario }}
    needs: list
    runs-on: ubuntu-latest
    # El escenario mas largo (1, 5 y 10 sesiones en reposo) tarda unos 9 min;
    # un runner con apt lento necesita margen.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.list.outputs.scenarios) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/download-artifact@v4
        with:
          name: resources-images

      - name: MySQL y PostgreSQL
        env:
          MYSQL_ID: ${{ needs.list.outputs.mysql }}
          POSTGRES_ID: ${{ needs.list.outputs.postgres }}
        run: |
          gunzip -c images.tar.gz | docker load -q
          test "$(docker image inspect -f '{{.Id}}' rowly-ci/mysql)" = "$MYSQL_ID"
          test "$(docker image inspect -f '{{.Id}}' rowly-ci/postgres)" = "$POSTGRES_ID"
          docker run -d --name mysql -e MYSQL_ROOT_PASSWORD=rowly -p 3306:3306 \
            --health-cmd="mysqladmin ping -uroot -prowly" --health-interval=5s --health-timeout=5s --health-retries=30 rowly-ci/mysql
          docker run -d --name postgres -e POSTGRES_PASSWORD=rowly -p 5432:5432 \
            --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=5s --health-retries=30 rowly-ci/postgres

      - name: Xvfb y dbus-run-session
        run: sudo apt-get update && sudo apt-get install -y $APT

      - uses: actions/setup-node@v4
        with:
          # 22: WebSocket nativo para el inspector de resources.mjs.
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: e2e-app
          path: bin

      - name: Servidores listos
        run: |
          for name in mysql postgres; do
            for _ in $(seq 120); do
              [ "$(docker inspect -f '{{.State.Health.Status}}' "$name")" = healthy ] && continue 2
              sleep 2
            done
            docker logs "$name" | tail -20
            exit 1
          done

      - name: Ciclos de recursos
        working-directory: app
        env:
          E2E_MYSQL_PORT: "3306"
          E2E_PG_PORT: "5432"
          E2E_SCENARIOS: ${{ matrix.scenario }}
        # Sin WebDriver: la app se abre con el inspector de WebKit, que mide el
        # heap de JavaScript vivo (tests/e2e/inspector.mjs).
        run: chmod +x ../bin/rowly-db && xvfb-run --auto-servernum dbus-run-session -- node tests/e2e/resources.mjs --app "$GITHUB_WORKSPACE/bin/rowly-db" --report "$RUNNER_TEMP/report.json"

      - name: Reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resources-${{ matrix.scenario }}
          path: ${{ runner.temp }}/report.json
          retention-days: 7

  report:
    name: Cada escenario corrio y paso
    needs: [list, scenario]
    if: always() && needs.list.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          sparse-checkout: tools/ci
      - uses: actions/download-artifact@v4
        with:
          pattern: resources-*
          path: reports
      - name: Escenarios
        env:
          SCENARIOS: ${{ needs.list.outputs.scenarios }}
        run: node tools/ci/scenarios.mjs reports --expect "$(jq -r 'join(",")' <<< "$SCENARIOS")"
