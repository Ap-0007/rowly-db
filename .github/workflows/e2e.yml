name: E2E

# Recorridos criticos en la app real sobre Linux/WebKitGTK (tauri-driver),
# con el binario de app-build.yml. Windows/WebView2 y macOS/WKWebView siguen
# siendo humo manual de release: tauri-driver no soporta macOS y en Windows
# necesita msedgedriver. Los ciclos de recursos son otro workflow
# (resources.yml) sobre el mismo binario: un fallo de recursos no tapa ni
# ensucia el resultado funcional.
#
# Corre con su propio bus de sesion (dbus-run-session), dentro de su Xvfb.
# Sin el, la app usa el bus de systemd del runner, que activa
# xdg-desktop-portal sin DISPLAY: cada arranque de la app quedaba 12-31 s
# esperando al portal, contra un limite de 30 s (#62).

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""

env:
  CARGO_TERM_COLOR: always
  APT: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential curl wget file libssl-dev libgtk-3-dev webkit2gtk-driver xvfb xdotool mysql-client dbus-bin
  # Version fija: la cache guarda este binario, no "el ultimo".
  TAURI_DRIVER: 2.1.0

jobs:
  linux:
    name: E2E (Linux, WebKitGTK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Imagenes de `verified` en tools/test-dbs/lines.json, con su digest: la
    # fuente unica de servidores de prueba (crates/server-tests lo comprueba).
    services:
      mysql:
        image: public.ecr.aws/docker/library/mysql:8.4.11@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
        env:
          MYSQL_ROOT_PASSWORD: rowly
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -uroot -prowly"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: WebKitWebDriver, Xvfb y dbus-run-session
        run: sudo apt-get update && sudo apt-get install -y $APT

      - name: tauri-driver en cache
        id: driver
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/tauri-driver
          key: tauri-driver-${{ env.TAURI_DRIVER }}-${{ runner.os }}-${{ runner.arch }}

      - uses: dtolnay/rust-toolchain@1.90
        if: steps.driver.outputs.cache-hit != 'true'

      - name: tauri-driver
        if: steps.driver.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --version "$TAURI_DRIVER" --locked

      # run.mjs solo usa la biblioteca estandar de Node.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: e2e-app
          path: bin

      - name: Recorridos E2E
        working-directory: app
        env:
          E2E_MYSQL_PORT: "3306"
        # run.mjs arranca un tauri-driver por recorrido, dentro de este display.
        run: chmod +x ../bin/rowly-db && xvfb-run --auto-servernum dbus-run-session -- node tests/e2e/run.mjs --app "$GITHUB_WORKSPACE/bin/rowly-db"
